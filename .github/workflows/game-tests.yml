name: Game engine tests

on:
  push:
    branches: [refactor/faithful-game-engine]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --test tests/game-engine.test.js
