<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050706">
    <title>Buckshot Roulette — Browser CLI</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <span class="site-brand">BUCKSHOT ROULETTE</span>
      <nav class="mode-switch" aria-label="Game modes">
        <button id="story-open" class="mode-button active" type="button" aria-pressed="true">Story Mode</button>
        <button id="multiplayer-open" class="mode-button" type="button" aria-pressed="false">Multiplayer</button>
      </nav>
    </header>

    <section id="multiplayer-panel" class="multiplayer-panel" hidden aria-labelledby="multiplayer-title">
      <h1 id="multiplayer-title" class="terminal-title">BUCKSHOT ROULETTE - MULTIPLAYER</h1>

      <div id="multiplayer-identity">
        <div class="inline-controls">
          <label for="multiplayer-username">Choose your username :</label>
          <input id="multiplayer-username" maxlength="16" minlength="3" pattern="[A-Za-z0-9_-]{3,16}" autocomplete="nickname"
            placeholder="3–16 characters">
          <button id="username-save" type="button">Save</button>
        </div>
      </div>

      <div id="multiplayer-lobby" hidden>
        <p class="identity-line">PLAYING AS: <strong id="multiplayer-player-name"></strong>
          <button id="username-change" class="text-button" type="button">Change</button>
        </p>
        <div class="multiplayer-actions">
          <button id="room-create" type="button">&gt; CREATE ROOM [ 1 ]</button>
          <button id="room-join-open" type="button">&gt; JOIN WITH CODE [ 2 ]</button>
          <form id="room-join-form" hidden>
            <label for="room-code">Enter room code:</label>
            <div class="inline-controls">
              <input id="room-code" inputmode="numeric" autocomplete="one-time-code"
                maxlength="4" pattern="[0-9]{4}" placeholder="0000" aria-label="Four-digit room code">
              <button type="submit">Join</button>
            </div>
          </form>
        </div>
      </div>

      <div id="multiplayer-room" hidden>
        <p id="multiplayer-status" class="status-line" role="status">Connecting...</p>
        <div id="join-request" class="join-request" hidden>
          <p>&gt; <strong id="join-request-name"></strong> wants to join ...</p>
          <div class="inline-controls">
            <button id="join-accept" type="button">Accept [ 1 ]</button>
            <button id="join-decline" class="secondary-button" type="button">Decline [ 2 ]</button>
          </div>
        </div>
        <div id="room-code-card" hidden>
          <p class="room-code-line">&gt; ROOM CODE: <strong id="room-code-display" class="room-code"></strong></p>
          <div class="inline-controls">
            <button id="room-copy-code" type="button">Copy room code</button>
            <button id="room-copy-invite" type="button">Copy invite message</button>
          </div>
          <p id="room-expiry" class="help-text" role="status"></p>
        </div>
        <div id="room-players" class="room-players" hidden></div>
        <button id="game-start" type="button" hidden>Start match</button>
        <section id="pvp-game" class="pvp-game" hidden aria-label="PvP match">
          <h2>Match</h2>
          <p id="pvp-turn" class="status-line"></p>
          <div id="pvp-scoreboard" class="pvp-scoreboard"></div>
          <p id="pvp-magazine" class="help-text"></p>
          <p id="pvp-known-shell" class="help-text"></p>
          <div id="pvp-controls" class="pvp-controls">
            <button id="pvp-shoot-opponent" type="button">Shoot opponent</button>
            <button id="pvp-shoot-self" class="secondary-button" type="button">Shoot yourself</button>
          </div>
          <div id="pvp-inventory" class="pvp-inventory"></div>
          <div id="pvp-steal" class="pvp-steal" hidden></div>
          <div id="pvp-events" class="pvp-events" aria-live="polite"></div>
        </section>
        <div class="inline-controls">
          <button id="multiplayer-reconnect" class="secondary-button" type="button" hidden>Reconnect</button>
          <button id="room-leave" class="secondary-button" type="button">Leave room</button>
        </div>
      </div>

      <p id="multiplayer-message" class="multiplayer-message" role="status" aria-live="polite"></p>
    </section>

    <main id="story-mode" aria-label="Buckshot Roulette Story Mode">
      <div id="screen" aria-live="polite"></div>
      <form id="command-form" autocomplete="off">
        <label id="prompt-label" for="command-input">Command:</label>
        <input id="command-input" name="command" type="text"
          autocomplete="off" autocapitalize="off" spellcheck="false"
          aria-label="Enter a game command">
      </form>
      <div id="keypad" role="group" aria-label="On-screen game controls">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="backspace" aria-label="Backspace">⌫</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="clear">Clear</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="r">R</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="enter" class="enter-key">Enter</button>
      </div>
    </main>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script>
    <script src="game.js"></script>
    <script src="multiplayer.js"></script>
  </body>
</html>
