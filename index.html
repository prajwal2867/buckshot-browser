<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050706">
    <title>Buckshot Roulette — Browser CLI</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main aria-label="Buckshot Roulette">
      <pre id="screen" aria-live="polite"></pre>
      <form id="command-form" autocomplete="off">
        <label id="prompt-label" for="command-input">Command:</label>
        <input id="command-input" name="command" type="text"
          autocomplete="off" autocapitalize="off" spellcheck="false"
          aria-label="Enter a game command">
      </form>
      <div id="keypad" role="group" aria-label="On-screen game controls">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="backspace" aria-label="Backspace">⌫</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="clear">Clear</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="r">R</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="enter" class="enter-key">Enter</button>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
